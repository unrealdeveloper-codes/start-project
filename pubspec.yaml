name: desa
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

#--------------- DEPENDENCIES ------------------#
dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1

  # Utility Packages
  http: ^1.1.0
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.0
  connectivity_plus: ^5.0.2
  go_router: ^14.2.0
  syncfusion_flutter_gauges:
  flutter_widget_from_html: ^0.15.3
  url_launcher: ^6.2.6
  firebase_core: ^3.9.0
  firebase_messaging:
  #  awesome_notifications: ^0.10.0
  flutter_local_notifications: ^18.0.1

  # State Management
  get: ^4.6.6

  # Storage
  get_storage: ^2.1.1

  # Product Specific
  carousel_slider: ^4.2.1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_html:

  # File Picker
  image_picker: ^0.8.7+4
  cached_network_image: ^3.3.1

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.1
  volume_controller: ^2.0.7
  screen_brightness: ^1.0.1
  loader_overlay: ^4.0.3
  fluttertoast: ^8.2.8
  #fvp: ^0.28.0

  # Chart
  fl_chart: ^0.69.0

#--------------- DEV DEPENDENCIES ------------------#
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.14.1"

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/onbordingScreen/
    - assets/backGroundImages/
    - assets/bottomBarSvgIcons/
    - assets/homePageIcons/
    - assets/imgs/
    - assets/tempicons/
    - assets/nutritionIcons/
    - assets/profileIcons/
    - assets/fitness/
    - assets/progress/imgs/
    - assets/progress/svgs/
    - assets/json/
    - assets/logo/
    - assets/svgs/

